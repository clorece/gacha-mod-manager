name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - run: rustup show active-toolchain
      # The desktop app (apps/desktop/src-tauri) is a workspace member; on Linux, Tauri needs
      # WebKitGTK and friends to build.
      - name: Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Security rules R2–R4: the privacy harness again, with every gmm process under strace.
      # It fails on connections that bypass the logging proxy, any canary file being opened,
      # and writes outside GMM's own folders and Mods/.
      - name: Privacy harness under strace
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq strace
          GMM_PRIVACY_STRACE=1 cargo test -p gmm-cli --test privacy --locked -- --nocapture
      # The workspace denies unsafe code. Reviewed exceptions (docs/04-security.md, R7): the
      # ShellExecuteExW call that starts XXMI, the RAR helper's job object, and the helper
      # itself (UnRAR calls and its own lockdown).
      - name: unsafe code only in the reviewed files
        if: runner.os == 'Linux'
        shell: bash
        run: |
          found=$(grep -rl --include='*.rs' 'allow(unsafe_code)' crates $( [ -d apps ] && echo apps ) | sort | tr '\n' ' ' || true)
          want="crates/gmm-archive/src/helper.rs crates/gmm-extract/src/main.rs crates/gmm-xxmi/src/launch.rs "
          if [ "$found" != "$want" ]; then
            echo "allow(unsafe_code) found outside the reviewed files:"; echo "$found"; exit 1
          fi
      # Security rule R7: GMM starts two kinds of process, each from one place: XXMI
      # (gmm-xxmi/src/launch.rs) and its RAR helper (gmm-archive/src/helper.rs). Tests may
      # start the helper directly.
      - name: Process launching only in its two places
        if: runner.os == 'Linux'
        shell: bash
        run: |
          found=$(grep -rl --include='*.rs' 'Command::new' crates $( [ -d apps ] && echo apps ) | grep -v '/tests/' | sort | tr '\n' ' ' || true)
          want="crates/gmm-archive/src/helper.rs crates/gmm-xxmi/src/launch.rs "
          if [ "$found" != "$want" ]; then
            echo "Command::new found outside the two launch places:"; echo "$found"; exit 1
          fi
      # Security rule R6: the test-only network feature (plain HTTP to localhost) must never
      # reach a shipped binary.
      - name: Shipped binaries never enable gmm-net/test-util
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for bin in gmm-cli gmm-desktop; do
            if cargo tree -p "$bin" -e features -i gmm-net | grep -q 'test-util'; then
              echo "gmm-net/test-util is enabled in $bin's dependency graph"; exit 1
            fi
          done
      # Security rule R6: the webview inspector only behind the desktop crate's `dev` feature.
      - name: Desktop builds without devtools by default
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if cargo tree -p gmm-desktop -e features -i tauri | grep -q 'devtools'; then
            echo "tauri/devtools is enabled without the dev feature"; exit 1
          fi

  frontend:
    name: Desktop frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # package.json pins the pnpm version; corepack fetches exactly that one.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm audit
      - run: pnpm run check-licenses
      - run: pnpm build

  deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
