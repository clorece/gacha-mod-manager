name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Security rules R2–R4: the privacy harness again, with every gmm process under strace.
      # It fails on connections that bypass the logging proxy, any canary file being opened,
      # and writes outside GMM's own folders and Mods/.
      - name: Privacy harness under strace
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace
          GMM_PRIVACY_STRACE=1 cargo test -p gmm-cli --test privacy --locked -- --nocapture
      # Security rule R6: the test-only network feature (plain HTTP to localhost) must never
      # reach a shipped binary.
      - name: Shipped binaries never enable gmm-net/test-util
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if cargo tree -p gmm-cli -e features -i gmm-net | grep -q 'test-util'; then
            echo "gmm-net/test-util is enabled in gmm-cli's dependency graph"; exit 1
          fi

  deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
