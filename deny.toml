# cargo-deny policy. See docs/04-security.md (R1, T7) and docs/06-licensing-and-provenance.md.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each ignored advisory needs a reason and a plan.
ignore = [
  # Unmaintained (not a vulnerability). A build-time proc macro of gtk-rs 0.18, which Tauri 2
  # uses for its window on Linux; no runtime code ships from it. Revisit when Tauri moves off
  # gtk-rs 0.18.
  { id = "RUSTSEC-2024-0370", reason = "build-time only, via Tauri's Linux gtk-rs 0.18" },
]

[licenses]
version = 2
# Must stay compatible with shipping GMM as MIT OR Apache-2.0. No GPL/LGPL/AGPL.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "CC0-1.0",
]
confidence-threshold = 0.9
# The list is our policy, not an inventory: allowed licenses no dependency uses yet are fine.
unused-allowed-license = "allow"
# Per-crate exceptions, each with a reason.
exceptions = [
  # Mozilla's CA certificate list (data, not code), used by the TLS certificate verifier.
  { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
  # The RAR helper vendors RARLAB's UnRAR source (crates/gmm-extract/vendor/unrar): free to use
  # for extracting RAR archives, not for writing a RAR compressor; its license text ships with
  # GMM (THIRD-PARTY-NOTICES.md). libarchive couldn't read real mod archives
  # (docs/09-archive-formats.md, RAR decision record).
  { crate = "gmm-extract", allow = ["LicenseRef-UnRAR"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Security rule R1: no telemetry or crash-upload SDKs, directly or transitively.
deny = [
  { crate = "sentry", reason = "no telemetry (R1)" },
  { crate = "sentry-core", reason = "no telemetry (R1)" },
  { crate = "tauri-plugin-sentry", reason = "no telemetry (R1)" },
  { crate = "posthog-rs", reason = "no telemetry (R1)" },
  { crate = "opentelemetry-otlp", reason = "no telemetry (R1)" },
  { crate = "tauri-plugin-aptabase", reason = "no telemetry (R1)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
