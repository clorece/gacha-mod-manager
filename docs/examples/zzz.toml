# Draft adapter manifest — Zenless Zone Zero. [verify] = confirm in Phase 0.

[game]
id = "zzz"
name = "Zenless Zone Zero"
engine = "unity"
risk_notice = "Modding may violate the game's Terms of Service. Use at your own risk."

[gamebanana]
game_id = 19567
[gamebanana.categories]            # root category id -> tag; subcategory name = character/bangboo
30305 = "character-skin"
30702 = "bangboo-skin"
30395 = "ui"
29874 = "other"

[xxmi]
importer = "ZZMI"                  # <XXMI>/ZZMI/
d3dx_target = "ZenlessZoneZero.exe"  # observed in d3dx.ini
launch_args = ["--nogui", "--xxmi", "ZZMI"]   # [verify]

[detect]
exe_names = ["ZenlessZoneZero.exe", "ZenlessZoneZeroBeta.exe"]
required_children = ["ZenlessZoneZero_Data"]
folder_names = ["ZenlessZoneZero Game"]

[detect.steam]
appid = 4162040                    # observed
subpath = "games/ZenlessZoneZero Game"   # observed: Steam copy wraps HoYoPlay

[detect.hoyoplay]
data_dir = "%APPDATA%/Cognosphere/HYP"   # observed; install-record file [verify]

[detect.epic]
display_names = ["Zenless Zone Zero"]    # [verify]

[[mod_kind]]
id = "migoto"
classify = { ini_contains_any = ["[TextureOverride", "[ShaderOverride"] }

[conflicts]
# Namespaces / folder names of shared library mods users put in Mods/ — never reported. [collect]
ignore_namespaces = []
