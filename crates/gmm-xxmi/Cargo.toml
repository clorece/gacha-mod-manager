[package]
name = "gmm-xxmi"
description = "Reads XXMI's setup (read-only) and works out each game's setup state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gmm-adapters.workspace = true
gmm-detect.workspace = true
gmm-fsguard.workspace = true
pelite.workspace = true
serde.workspace = true
serde_json.workspace = true

# Starting XXMI through the Windows shell so its administrator prompt can appear (launch.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
