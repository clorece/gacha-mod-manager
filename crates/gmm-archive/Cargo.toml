[package]
name = "gmm-archive"
description = "Hardened extraction of mod archives, plus a policy scan of what came out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gmm-fsguard.workspace = true
# LZMA/LZMA2 (what mod archives use) are built in. BZip2 is left out: its decoder's license
# (bzip2-1.0.6) isn't on our allowlist, and 7z mod archives practically never use it.
sevenz-rust2 = { workspace = true, features = ["deflate", "ppmd"] }
thiserror.workspace = true
zip.workspace = true

# The RAR helper's job object (helper.rs, docs/security.md R7).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
proptest.workspace = true
# The writer side is only needed to build test archives.
sevenz-rust2 = { workspace = true, features = ["compress", "deflate", "ppmd"] }
tempfile.workspace = true

[lints]
workspace = true
