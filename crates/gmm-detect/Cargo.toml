[package]
name = "gmm-detect"
description = "Finds installed games: Steam, HoYoPlay, GRYPHLINK, Epic, or a folder the user picks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# TypeScript types for the desktop app (ts-rs).
ts = ["dep:ts-rs"]

[dependencies]
dirs.workspace = true
gmm-adapters.workspace = true
gmm-fsguard.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
winreg.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
