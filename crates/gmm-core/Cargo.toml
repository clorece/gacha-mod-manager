[package]
name = "gmm-core"
description = "GMM's features on top of the building blocks: install, library, conflicts, storage, launch, images"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# TypeScript types for the desktop app (ts-rs).
ts = ["dep:ts-rs", "gmm-catalog/ts", "gmm-xxmi/ts"]

[dependencies]
dirs.workspace = true
gmm-adapters.workspace = true
gmm-archive.workspace = true
gmm-catalog.workspace = true
gmm-db.workspace = true
gmm-detect.workspace = true
gmm-fsguard.workspace = true
gmm-migoto.workspace = true
gmm-net.workspace = true
gmm-xxmi.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
gmm-net = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
wiremock.workspace = true
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
