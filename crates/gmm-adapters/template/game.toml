# Template for a new game's manifest. Copy to games/<id>.toml and fill in every TODO.
# Facts and their sources go in docs/game-adapters.md ("The games" table).
#
# Placeholders are zero/empty on purpose: until they're filled in, validation rejects the file
# (tests/registry.rs, `template_matches_schema`), so a half-done copy can't ship.
#
# Everything a new game touches; nothing else is per game:
#   1. games/<id>.toml           this file, filled in
#   2. src/registry.rs           add ("<id>.toml", include_str!("../games/<id>.toml")) to BUILTIN
#   3. src/manifest.rs           only if the importer isn't in `Importer` yet
#   4. tests/registry.rs         add <id> to `builtin_manifests_load`, add a `<id>_facts` test
#   5. Banner (optional; without one the game gets the neutral banner):
#        apps/desktop/src/assets/banners/<id>.jpg   2:1, 1800 x 900
#        apps/desktop/src/games.ts                  add "<id>" to `knownBanners`
#        apps/desktop/src/styles.css                `.bn-<id>` background, and `.bn-<id>::after`
#        THIRD-PARTY-NOTICES.md, docs/licensing.md, README.md   credit the art
#   6. docs/game-adapters.md     a column in "The games"; README.md's list of games
#   7. A launcher GMM can't detect yet (not Steam, HoYoPlay, GRYPHLINK or Epic) is a new
#      source in crates/gmm-detect, shared by every game that uses it. Manual folders work
#      meanwhile.
#
# The conformance suite (crates/gmm-core/tests/conformance.rs) then runs against the new game.
#
# Compiled into GMM; never loaded from disk at runtime (docs/security.md, R7).

[game]
id = ""                 # TODO: 2-16 chars, a-z 0-9 '-'. Used in the CLI and the database.
name = ""               # TODO: full name
short_name = ""         # TODO: badge label
engine = "other"        # TODO: unity | unreal4 | unreal5 | other
# Same text for every game so far.
risk_notice = "Modding may violate the game's Terms of Service. Use at your own risk."

[gamebanana]
game_id = 0             # TODO: from the game's GameBanana URL (gamebanana.com/games/<id>)

# TODO: the game's root mod categories (docs/gamebanana-api.md). Tags: character_skin,
# companion_skin, ui, other. ZZZ and WuWa both have a skins, a UI and an Other/Misc root.
[[gamebanana.root_categories]]
id = 0
name = "Skins"
tag = "character_skin"
subcategories_are_characters = true

[[gamebanana.root_categories]]
id = 0
name = "UI"
tag = "ui"

[[gamebanana.root_categories]]
id = 0
name = "Other/Misc"
tag = "other"

[xxmi]
importer = "EFMI"       # TODO: ZZMI | WWMI | EFMI | SRMI | GIMI | HIMI
d3dx_target = ""        # TODO: the exe `target = ` in <XXMI>/<importer>/d3dx.ini (observed)

[detect]
exe_names = []          # TODO: exe(s) directly in the game folder
required_children = []  # TODO: folders/files that must exist, relative to the game folder
folder_names = []       # TODO: typical game folder names, for the drive scan

# Remove if the game isn't on Steam.
[detect.steam]
appid = 0               # TODO
# Game folder relative to steamapps/common/<installdir>; "" if it's the same folder.
subpath = ""
# true only if XXMI was observed starting the Steam copy with "Game Launch" = Direct.
direct_launch = false

# Remove if the game isn't on Epic.
[detect.epic]
display_names = []      # TODO: DisplayName in Epic's install manifests

# Same for every XXMI game so far.
[[mod_kind]]
id = "migoto"
ini_markers = ["[TextureOverride", "[ShaderOverride"]

[conflicts]
ignore_namespaces = []
