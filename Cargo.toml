[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/clorece/gacha-mod-manager"

[workspace.dependencies]
gmm-adapters = { path = "crates/gmm-adapters" }
gmm-archive = { path = "crates/gmm-archive" }
gmm-catalog = { path = "crates/gmm-catalog" }
gmm-core = { path = "crates/gmm-core" }
gmm-db = { path = "crates/gmm-db" }
gmm-detect = { path = "crates/gmm-detect" }
gmm-fsguard = { path = "crates/gmm-fsguard" }
gmm-migoto = { path = "crates/gmm-migoto" }
gmm-net = { path = "crates/gmm-net" }
gmm-xxmi = { path = "crates/gmm-xxmi" }

clap = { version = "4", features = ["derive"] }
dirs = "7"
hex = "0.4"
md-5 = "0.11"
# Reads only the version resource of XXMI's d3d11.dll, from bytes read through gmm-fsguard.
pelite = { version = "0.10", default-features = false, features = ["std"] }
# HTTPS via rustls with the ring backend (no aws-lc/C build tools) and the OS certificate
# store. Only gmm-net may use reqwest (security rule R2).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# The desktop app (apps/desktop/src-tauri). No plugin is exposed to the webview; the dialog
# plugin is only called from Rust for folder pickers (security rule R5).
tauri = { version = "2.12", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11"] }
tauri-build = { version = "2.7", default-features = false }
tauri-plugin-dialog = "2.8"
# TypeScript types for the app, generated from the Rust types behind each crate's `ts` feature.
ts-rs = { version = "12", default-features = false, features = ["serde-compat", "no-serde-warnings"] }
# SQLite with the bundled C library (no system SQLite needed). No `macros` (no compile-time
# DB access) and no `sqlite-load-extension` (GMM never loads SQLite extensions).
sqlx = { version = "0.9", default-features = false, features = ["sqlite-bundled", "runtime-tokio", "migrate"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
url = "2"
# Registry reads (Steam path, XXMI install record). Only gmm-detect's platform module uses it.
winreg = "0.56"
# 7z: pure-Rust decoders only. Features are chosen per crate.
sevenz-rust2 = { version = "0.24", default-features = false }
# Free disk space for the storage report. Only gmm-fsguard uses it.
fs4 = { version = "1", default-features = false, features = ["sync"] }
# Recycle Bin moves (security rule R8). Only gmm-fsguard uses it. No chrono (that's for
# listing the bin, which GMM doesn't do).
trash = { version = "5", default-features = false, features = ["coinit_apartmentthreaded"] }
thiserror = "2"
# zip: pure-Rust decoders only (no C zlib/bzip2/zstd).
zip = { version = "9", default-features = false, features = [
  "deflate-flate2-zlib-rs",
  "deflate64",
  "lzma",
] }

# dev
proptest = "1"
tempfile = "3"
wiremock = "0.6"

# Compression and hashing crates are painfully slow unoptimized; our own code stays debuggable.
[profile.dev.package."*"]
opt-level = 2

[workspace.lints.rust]
# One reviewed exception: the ShellExecuteExW call in gmm-xxmi/src/launch.rs (CI checks it
# stays the only `allow(unsafe_code)`).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
unwrap_used = "warn"
